server:
  port: 8084

spring:
  application:
    name: rag-basics-spring
  ai:
    openai:
      # ==============================================================
      # OPTION A: Google Gemini for Chat + OpenAI for Embeddings
      # ==============================================================
      api-key: ${AI_API_KEY:${GOOGLE_API_KEY:${OPENAI_API_KEY:demo-key}}}
      base-url: ${AI_BASE_URL:${GOOGLE_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}}
      chat:
        options:
          model: ${AI_MODEL:gemini-3.8-flash}
          temperature: 0.0
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

      # ==============================================================
      # OPTION B: Full Official OpenAI (Chat + Embeddings)
