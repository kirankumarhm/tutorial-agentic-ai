authors = [
    { name = "Kiran Kumar H M", email = "kirankumarhm2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
     "langchain>=1.4.7",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.2.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.7",
