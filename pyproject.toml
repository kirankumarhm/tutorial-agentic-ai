[project]
name = "tutorial-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiran Kumar H M", email = "kirankumarhm2004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
     "langchain>=1.4.7",
     "langchain-core>=1.0.0",
     "langchain-google-genai>=4.2.2",
     "langchain-groq>=1.1.3",
     "langchain-openai>=1.4.7",
     "python-dotenv>=1.2.2",
     "streamlit>=1.57.0",
     "ipykernel>=7.2.0",
     "notebook>=7.5.6",
     "langchain-chroma>=1.1.0",
     "langchain-huggingface>=1.2.2",
     "chromadb>=1.5.9",
     "sentence-transformers>=6.2.0",
     "pandas>=3.0.2",
     "fpdf2>=2.8.7",
     "pypdf>=6.11.0",
     "langchain-community>=0.4.1",
     "langchain-text-splitters>=1.1.2",
     "pillow>=12.2.0",
     "torchvision>=0.27.0",
     "ipywidgets>=8.1.9",
]

[project.scripts]
tutorial-agentic-ai = "tutorial_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
